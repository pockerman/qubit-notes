name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# the app runs on its own platform, so nothing but this repository is needed; gogi-python, for its gogi extra, is not
# installed. The repository is checked out in $GITHUB_WORKSPACE/qubit-notes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qubit-notes

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qubit-notes/frontend/package-lock.json

      - name: Install backend
        working-directory: qubit-notes/backend
        run: uv sync --extra dev

      - name: Lint backend
        working-directory: qubit-notes/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Install frontend
        working-directory: qubit-notes/frontend
        run: npm ci

      - name: Lint and type-check frontend
        working-directory: qubit-notes/frontend
        run: |
          npm run lint
          npx tsc -b --noEmit

  test:
    runs-on: ubuntu-latest
    # the app's own database, as deployed
    services:
      postgres:
        # with pgvector, which the app's own platform searches with
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qubit
          POSTGRES_PASSWORD: qubit
          POSTGRES_DB: qubit_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qubit" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: qubit-notes

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qubit-notes/frontend/package-lock.json

      - name: Install backend and Chromium
        working-directory: qubit-notes/backend
        run: |
          uv sync --extra dev
          uv run playwright install --with-deps chromium

      - name: Install frontend
        working-directory: qubit-notes/frontend
        run: npm ci

      # every scenario against the in-memory platform, with the app's data in Postgres; the @ui ones build the
      # frontend and drive it in Chromium. The migrations are checked on SQLite and Postgres. The runs on gogi need a
      # gogi stack and stay local (make bdd-gogi)
      - name: Run the scenarios
        working-directory: qubit-notes/backend
        env:
          QUBIT_NOTES_TEST_DATABASE_URL: postgresql+psycopg://qubit:qubit@localhost:5432/qubit_notes
        run: uv run pytest --ignore=tests/unit/test_migrations.py

      # the @platform and @standalone scenarios against the app's own platform, searching with pgvector, with its
      # in-app embedding models and a stand-in for the AI
      - name: Run the scenarios on the app's own platform
        working-directory: qubit-notes/backend
        env:
          QUBIT_NOTES_TEST_DATABASE_URL: postgresql+psycopg://qubit:qubit@localhost:5432/qubit_notes
        run: uv run pytest --platform=standalone --ignore=tests/unit

      - name: Check the migrations
        working-directory: qubit-notes/backend
        env:
          QUBIT_NOTES_TEST_POSTGRES_URL: postgresql+psycopg://qubit:qubit@localhost:5432/qubit_notes
        run: uv run pytest tests/unit/test_migrations.py

  # the app's container image: built for every PR; pushed from main as ghcr.io/<owner>/qubit-notes:main and :sha-<commit>.
  # Releases are pushed with their version by release.yml
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: qubit-notes

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: qubit-notes
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/qubit-notes:main
            ghcr.io/${{ github.repository_owner }}/qubit-notes:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
