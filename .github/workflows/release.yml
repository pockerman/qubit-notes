name: Release

# release-please reads the conventional commits on main and keeps a release PR open with the next version and the
# CHANGELOG; merging that PR tags the release and publishes it on GitHub
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
