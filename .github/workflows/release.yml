name: Release

# release-please reads the conventional commits on main and keeps a release PR open with the next version and the
# CHANGELOG; merging that PR tags the release and publishes it on GitHub
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

  # a release's container image: ghcr.io/<owner>/qubit-notes:<version> and :latest
  image:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qubit-notes

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: qubit-notes
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qubit-notes:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/qubit-notes:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
