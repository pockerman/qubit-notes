[project]
name = "study-assistant"
version = "0.1.0"
description = "A study assistant built on the gogi platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "loguru>=0.7.3",
    "gogi-python",
    # the app's own data: notes, summaries, quizzes
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.0",
    "httpx>=0.27",
    "playwright>=1.47",
    "ruff>=0.14.0",
    # the fake platform reads PDFs, and the tests write them
    "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
gogi-python = { path = "../../gogi-python", editable = true }

[tool.uv.extra-build-dependencies]
grpcio-tools = ["pkg_resources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
bdd_features_base_dir = "../features"
markers = [
    "gogi: the scenario also runs against the real gogi platform (--platform=gogi)",
    "ui: the scenario drives the React UI with Playwright",
    "wip: written and reviewed, but not built yet; skipped",
    "ai: the scenario needs the AI; on gogi it runs only with --with-ai",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["study_assistant"]
