[project]
name = "qubit-notes"
version = "0.1.0"
description = "Study your own material with notes, summaries, quizzes and an AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "loguru>=0.7.3",
    # the app's own data: notes, summaries, quizzes, and its own platform's material, conversations and memories
    "sqlalchemy>=2.0",
    "pyjwt[crypto]>=2.9",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.5.1",
    # the app's own platform: reading PDFs, the files in S3, the embedding models and the model providers
    "pypdf>=5.0",
    "boto3>=1.43.117",
    "fastembed>=0.9.0",
    "httpx>=0.27",
    "anthropic>=2.1.0",
    "openai>=3.36.1",
    "pymupdf4llm==1.28.2",
    "ebooklib>=0.20",
    "markdownify>=1.2.3",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
qubit-notes = "qubit_notes.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.0",
    "playwright>=1.47",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
bdd_features_base_dir = "../features"
markers = [
    "platform: the scenario also runs against a real platform: the app's own (--platform=standalone) or gogi (--platform=gogi)",
    "standalone: the scenario runs only against the app's own platform (--platform=standalone)",
    "embedding_keys: the scenario embeds with Voyage AI or OpenAI; it runs only with --with-embedding-keys",
    "ui: the scenario drives the React UI with Playwright",
    "wip: written and reviewed, but not built yet; skipped",
    "ai: the scenario needs the AI; on gogi it runs only with --with-ai",
    "cognito: students sign in with Cognito; the tests stand in for it with tests/fakes/fake_cognito.py",
    "gogi_keys: on gogi, the app runs as a registered application of gogi, through the gateway that requires keys",
    "gogi_wrong_key: on gogi, the app runs with a key gogi did not give, through the gateway that requires keys",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["qubit_notes"]
