# For writing migrations: from backend/, `uv run alembic revision --autogenerate -m "..."` compares storage.py with
# the database of QUBIT_NOTES_DATABASE_URL. The app migrates its database itself when it starts.
[alembic]
script_location = %(here)s/src/qubit_notes/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
